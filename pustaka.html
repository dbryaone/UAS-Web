<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Pustaka | Yang Mulia</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --yellow: #FFE14E; --navy: #192853; --bg: #ECE1D5; }
        body { background-color: var(--bg); color: var(--navy); font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        header { background-color: var(--navy); color: var(--yellow); padding: 20px 0; text-align: center; border-bottom: 4px solid var(--yellow); }
        header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin: 0; letter-spacing: 2px; text-transform: uppercase; }
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .section-title { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        
        .book-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 20px; margin-bottom: 60px; }
        .book-item { text-align: left; cursor: pointer; }
        .book-cover { width: 100%; aspect-ratio: 3/4; background-color: var(--navy); border-radius: 8px; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s; overflow: hidden; }
        .book-cover img { width: 100%; height: 100%; object-fit: cover; }
        .book-item:hover .book-cover { transform: scale(1.05); }
        .book-title { font-size: 0.8rem; font-weight: 600; line-height: 1.2; }

        .quote-box { text-align: center; padding: 60px 20px; margin: 40px 0; background: rgba(25, 40, 83, 0.03); border-radius: 20px; border-left: 5px solid var(--yellow); }
        .quote-box p { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-style: italic; margin: 0; }
        footer { background-color: var(--navy); color: var(--yellow); text-align: center; padding: 40px 20px; font-size: 0.85rem; font-family: 'Playfair Display', serif; border-top: 4px solid var(--yellow); }
        .btn-back { position: fixed; bottom: 30px; right: 30px; background: var(--navy); color: var(--yellow); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 1000; border: 2px solid var(--yellow); }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(25, 40, 83, 0.9); backdrop-filter: blur(8px); align-items: center; justify-content: center; }
        .modal-content { background-color: var(--bg); padding: 40px; border-radius: 24px; width: 90%; max-width: 600px; position: relative; color: var(--navy); }
        .modal-body { display: flex; gap: 30px; flex-wrap: wrap; }
        .modal-left { flex: 1; min-width: 150px; }
        .modal-right { flex: 2; min-width: 250px; }
        .modal-cover-view { width: 100%; aspect-ratio: 3/4; background: var(--navy); border-radius: 8px; overflow: hidden; }
        .modal-cover-view img { width: 100%; height: 100%; object-fit: cover; }
        .close-btn { position: absolute; right: 25px; top: 15px; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>
    <header><h1>Pustaka</h1></header>
    <div class="container">
        <div class="section-header"><div class="section-title">Rak Buku Digital <span>→</span></div></div>
        <div class="book-row" id="bookList">
            <p>Membuka lembaran...</p>
        </div>
        <div class="quote-box"><p>"Sebuah buku adalah taman yang dibawa dalam saku."</p></div>
    </div>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <div class="modal-left"><div class="modal-cover-view" id="modalCover"></div></div>
                <div class="modal-right">
                    <h2 id="modalTitle">Judul</h2>
                    <p><strong>Genre:</strong> <span id="modalGenre"></span> | <span id="modalType"></span></p>
                    <p><strong>Rating:</strong> <span id="modalRating"></span>/5 ⭐</p>
                    <hr>
                    <p id="modalReview"></p>
                </div>
            </div>
        </div>
    </div>

    <footer>Dikurasi dengan teliti oleh Yang Mulia &bull; 2026</footer>
    <a href="index.html" class="btn-back">←</a>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6-n2ano058aDWtaJBCLSNj0wlk7ZVKoU",
            databaseURL: "https://sinema-pustaka-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "sinema-pustaka",
            appId: "1:592763345706:web:06adc893f3487bc4d0dc53"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        database.ref('books').on('value', (snapshot) => {
            const container = document.getElementById('bookList');
            container.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.keys(data).reverse().forEach(key => {
                    const buku = data[key];
                    container.innerHTML += `
                        <div class="book-item" onclick="openModal('${buku.title}', '${buku.coverUrl}', '${buku.review.replace(/'/g, "\\'")}', '${buku.genre}', '${buku.type}', '${buku.rating}')">
                            <div class="book-cover"><img src="${buku.coverUrl}" onerror="this.src='https://via.placeholder.com/150x200?text=No+Cover'"></div>
                            <div class="book-title">${buku.title}</div>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = '<p>Rak buku masih kosong, Yang Mulia.</p>';
            }
        });

        function openModal(title, img, review, genre, type, rating) {
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalCover").innerHTML = `<img src="${img}">`;
            document.getElementById("modalReview").innerText = review;
            document.getElementById("modalGenre").innerText = genre;
            document.getElementById("modalType").innerText = type;
            document.getElementById("modalRating").innerText = rating;
            document.getElementById("infoModal").style.display = "flex";
        }

        function closeModal() { document.getElementById("infoModal").style.display = "none"; }
    </script>
</body>
</html>
