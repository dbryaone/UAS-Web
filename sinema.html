<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Sinema | Yang Mulia</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --yellow: #FFE14E; --navy: #192853; --bg: #ECE1D5; }
        body { background-color: var(--bg); color: var(--navy); font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        header { background-color: var(--navy); color: var(--yellow); padding: 20px 0; text-align: center; border-bottom: 4px solid var(--yellow); }
        header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin: 0; letter-spacing: 2px; text-transform: uppercase; }
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .section-title { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        
        /* Grid untuk list film */
        .movie-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 25px; margin-bottom: 60px; }
        
        .movie-item { text-align: left; cursor: pointer; transition: 0.3s; }
        .movie-poster { width: 100%; aspect-ratio: 2/3; background-color: var(--navy); border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: transform 0.3s ease; overflow: hidden; }
        .movie-poster img { width: 100%; height: 100%; object-fit: cover; }
        .movie-item:hover .movie-poster { transform: translateY(-10px); }
        .movie-title { font-size: 0.9rem; font-weight: 600; line-height: 1.2; padding: 0 5px; }

        .quote-box { text-align: center; padding: 60px 20px; margin: 40px 0; background: rgba(25, 40, 83, 0.03); border-radius: 20px; border-left: 5px solid var(--yellow); }
        .quote-box p { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-style: italic; margin: 0; }
        footer { background-color: var(--navy); color: var(--yellow); text-align: center; padding: 40px 20px; font-size: 0.85rem; font-family: 'Playfair Display', serif; border-top: 4px solid var(--yellow); }
        .btn-back { position: fixed; bottom: 30px; right: 30px; background: var(--navy); color: var(--yellow); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 1000; border: 2px solid var(--yellow); }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(25, 40, 83, 0.9); backdrop-filter: blur(8px); align-items: center; justify-content: center; }
        .modal-content { background-color: var(--bg); padding: 40px; border-radius: 24px; width: 90%; max-width: 700px; position: relative; color: var(--navy); }
        .modal-body { display: flex; gap: 30px; flex-wrap: wrap; }
        .modal-left { flex: 1; min-width: 200px; }
        .modal-right { flex: 2; min-width: 250px; }
        .modal-poster-view { width: 100%; aspect-ratio: 2/3; background: var(--navy); border-radius: 12px; overflow: hidden; }
        .modal-poster-view img { width: 100%; height: 100%; object-fit: cover; }
        .close-btn { position: absolute; right: 25px; top: 15px; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>
    <header><h1>Sinema</h1></header>
    <div class="container">
        <div class="section-header"><div class="section-title">Koleksi Terkini <span>→</span></div></div>
        <div class="movie-row" id="movieList">
            <p id="loadingText">Sedang memanggil arsip...</p>
        </div>
        <div class="quote-box"><p>"Film adalah cermin kehidupan."</p></div>
    </div>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <div class="modal-left"><div class="modal-poster-view" id="modalPoster"></div></div>
                <div class="modal-right">
                    <h2 id="modalTitle">Judul</h2>
                    <p id="modalGenre" style="font-weight: 600; color: #555;"></p>
                    <p><strong>Platform:</strong> <span id="modalPlatform"></span></p>
                    <hr>
                    <p id="modalDesc"></p>
                </div>
            </div>
        </div>
    </div>

    <footer>Dikurasi dengan teliti oleh Yang Mulia &bull; 2026</footer>
    <a href="index.html" class="btn-back">←</a>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6-n2ano058aDWtaJBCLSNj0wlk7ZVKoU",
            databaseURL: "https://sinema-pustaka-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "sinema-pustaka",
            appId: "1:592763345706:web:06adc893f3487bc4d0dc53"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Ambil Data Film
        database.ref('movies').on('value', (snapshot) => {
            const container = document.getElementById('movieList');
            container.innerHTML = ''; // Kosongkan dulu
            
            const data = snapshot.val();
            if (data) {
                Object.keys(data).reverse().forEach(key => { // Reverse biar yang baru di atas
                    const film = data[key];
                    const movieHtml = `
                        <div class="movie-item" onclick="openModal('${film.title}', '${film.posterUrl}', '${film.description.replace(/'/g, "\\'")}', '${film.genre}', '${film.platform}')">
                            <div class="movie-poster"><img src="${film.posterUrl}" onerror="this.src='https://via.placeholder.com/200x300?text=No+Poster'"></div>
                            <div class="movie-title">${film.title}</div>
                        </div>
                    `;
                    container.innerHTML += movieHtml;
                });
            } else {
                container.innerHTML = '<p>Belum ada film yang tersimpan, Yang Mulia.</p>';
            }
        });

        function openModal(title, img, desc, genre, platform) {
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalPoster").innerHTML = `<img src="${img}">`;
            document.getElementById("modalDesc").innerText = desc;
            document.getElementById("modalGenre").innerText = genre;
            document.getElementById("modalPlatform").innerText = platform;
            document.getElementById("infoModal").style.display = "flex";
        }

        function closeModal() { document.getElementById("infoModal").style.display = "none"; }
        window.onclick = (e) => { if (e.target == document.getElementById("infoModal")) closeModal(); }
    </script>
</body>
</html>
