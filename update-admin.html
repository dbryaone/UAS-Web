<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Room | Yang Mulia</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #FFE14E;
            --navy: #192853;
            --bg: #ECE1D5;
        }

        body {
            background-color: var(--bg);
            color: var(--navy);
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        header {
            background-color: var(--navy);
            color: var(--yellow);
            padding: 30px 0;
            text-align: center;
            border-bottom: 4px solid var(--yellow);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            margin: 0; letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            flex-grow: 1;
        }

        .admin-gates {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .gate-card {
            background-color: var(--navy);
            color: var(--yellow);
            padding: 50px 20px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .gate-card:hover {
            transform: translateY(-8px);
            border-color: var(--yellow);
            box-shadow: 0 15px 30px rgba(25, 40, 83, 0.2);
        }

        .form-section {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            display: none;
            border-top: 8px solid var(--navy);
        }

        .form-section h2 { font-family: 'Playfair Display', serif; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.8rem; text-transform: uppercase; color: #555; }
        
        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }

        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .btn-save {
            background-color: var(--navy);
            color: var(--yellow);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-save:hover { background-color: #253b7a; }

        .btn-back-gate {
            background-color: transparent;
            color: var(--navy);
            border: 2px solid var(--navy);
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }

        .footer-link { text-align: center; margin-top: 40px; }
        .footer-link a { color: var(--navy); text-decoration: none; font-weight: 500; border-bottom: 1px solid var(--navy); }
    </style>
</head>
<body>

    <header><h1>Admin Control</h1></header>

    <div class="container">
        <div class="admin-gates" id="adminGates">
            <div class="gate-card" onclick="showForm('buku')">
                <h2 style="font-family: 'Playfair Display', serif;">Pustaka</h2>
                <p>Input Buku Baru</p>
            </div>
            <div class="gate-card" onclick="showForm('film')">
                <h2 style="font-family: 'Playfair Display', serif;">Sinema</h2>
                <p>Input Film Baru</p>
            </div>
        </div>

        <div id="formBuku" class="form-section">
            <h2>Detail Buku</h2>
            <form id="formInputBuku">
                <div class="form-group">
                    <label>Judul Buku</label>
                    <input type="text" id="buku-judul" placeholder="Contoh: Bumi Manusia">
                </div>
                <div class="form-group">
                    <label>URL Cover Buku</label>
                    <input type="text" id="buku-cover" placeholder="https://link-gambar.jpg">
                </div>
                <div class="form-group">
                    <label>Sinopsis</label>
                    <textarea id="buku-sinopsis" rows="3" placeholder="Ceritain dikit..."></textarea>
                </div>
                <div class="grid-form">
                    <div class="form-group">
                        <label>Jenis</label>
                        <select id="buku-jenis"><option>Buku Fisik</option><option>E-Book</option></select>
                    </div>
                    <div class="form-group"><label>Genre</label><input type="text" id="buku-genre"></div>
                </div>
                <div class="grid-form">
                    <div class="form-group"><label>Hal.</label><input type="number" id="buku-halaman"></div>
                    <div class="form-group"><label>Rating</label><input type="number" id="buku-rating" max="5" min="1"></div>
                </div>
                <div class="form-group">
                    <label>Review</label>
                    <textarea id="buku-review" rows="4"></textarea>
                </div>
                <button type="button" class="btn-save" onclick="simpanBuku()">Simpan Koleksi</button>
                <button type="button" class="btn-back-gate" onclick="resetView()">← Kembali</button>
            </form>
        </div>

        <div id="formFilm" class="form-section">
            <h2>Detail Sinema</h2>
            <form id="formInputFilm">
                <div class="form-group">
                    <label>Judul Film</label>
                    <input type="text" id="film-judul" placeholder="Contoh: Interstellar">
                </div>
                <div class="form-group">
                    <label>URL Poster</label>
                    <input type="text" id="film-poster" placeholder="https://link-poster.jpg">
                </div>
                <div class="form-group">
                    <label>Sinopsis</label>
                    <textarea id="film-sinopsis" rows="3" placeholder="Tentang apa ini?"></textarea>
                </div>
                <div class="grid-form">
                    <div class="form-group"><label>Platform</label><input type="text" id="film-platform" placeholder="Netflix / Bioskop"></div>
                    <div class="form-group"><label>Genre</label><input type="text" id="film-genre"></div>
                </div>
                <div class="form-group">
                    <label>Kesan Sinematik</label>
                    <textarea id="film-kesan" rows="4"></textarea>
                </div>
                <button type="button" class="btn-save" onclick="simpanFilm()">Simpan Tontonan</button>
                <button type="button" class="btn-back-gate" onclick="resetView()">← Kembali</button>
            </form>
        </div>
        
        <div class="footer-link"><a href="index.html">Kembali ke Dashboard Utama</a></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        // CONFIGURASI DENGAN DATABASE URL (PENTING!)
        const firebaseConfig = {
            apiKey: "AIzaSyA6-n2ano058aDWtaJBCLSNj0wlk7ZVKoU",
            // Alamat gudang lo di Singapore:
            databaseURL: "https://sinema-pustaka-default-rtdb.asia-southeast1.firebasedatabase.app", 
            authDomain: "sinema-pustaka.firebaseapp.com",
            projectId: "sinema-pustaka",
            storageBucket: "sinema-pustaka.firebasestorage.app",
            messagingSenderId: "592763345706",
            appId: "1:592763345706:web:06adc893f3487bc4d0dc53",
            measurementId: "G-ERL14C15FC"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Cek koneksi di console
        console.log("Sistem Admin Siap, Yang Mulia!");

        // Fungsi Navigasi
        function showForm(type) {
            document.getElementById('adminGates').style.display = 'none';
            document.getElementById(type === 'buku' ? 'formBuku' : 'formFilm').style.display = 'block';
        }

        function resetView() {
            document.getElementById('formBuku').style.display = 'none';
            document.getElementById('formFilm').style.display = 'none';
            document.getElementById('adminGates').style.display = 'grid';
        }

        // Fungsi Simpan Film
        function simpanFilm() {
            const data = {
                title: document.getElementById('film-judul').value,
                posterUrl: document.getElementById('film-poster').value,
                description: document.getElementById('film-sinopsis').value,
                platform: document.getElementById('film-platform').value,
                genre: document.getElementById('film-genre').value,
                review: document.getElementById('film-kesan').value,
                timestamp: Date.now()
            };

            if(!data.title || !data.posterUrl) return alert("Judul & Poster wajib diisi, Yang Mulia!");

            database.ref('movies').push(data)
                .then(() => {
                    alert("Film meluncur ke awan! ✨");
                    document.getElementById('formInputFilm').reset();
                    resetView();
                })
                .catch(e => {
                    console.error(e);
                    alert("Gagal simpan: " + e.message);
                });
        }

        // Fungsi Simpan Buku
        function simpanBuku() {
            const data = {
                title: document.getElementById('buku-judul').value,
                coverUrl: document.getElementById('buku-cover').value,
                description: document.getElementById('buku-sinopsis').value,
                type: document.getElementById('buku-jenis').value,
                genre: document.getElementById('buku-genre').value,
                pages: document.getElementById('buku-halaman').value,
                rating: document.getElementById('buku-rating').value,
                review: document.getElementById('buku-review').value,
                timestamp: Date.now()
            };

            if(!data.title || !data.coverUrl) return alert("Judul & Cover wajib diisi, Yang Mulia!");

            database.ref('books').push(data)
                .then(() => {
                    alert("Buku berhasil diarsipkan! 📚");
                    document.getElementById('formInputBuku').reset();
                    resetView();
                })
                .catch(e => {
                    console.error(e);
                    alert("Gagal simpan: " + e.message);
                });
        }
    </script>
</body>
</html>
